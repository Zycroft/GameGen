version: '3.8'

services:
  ai-worker:
    build: .
    container_name: gamegen-ai-worker
    restart: unless-stopped
    environment:
      - DYNAMODB_ENDPOINT=http://localhost:8001
      - DYNAMODB_REGION=us-west-2
      - OLLAMA_ENDPOINT=http://localhost:11434
      - AI_PROMPTS_TABLE=AIPrompts
      - POLL_INTERVAL=10
      - REQUEST_TIMEOUT=600
      - MIN_REQUEST_INTERVAL=2
      - IMAGE_SERVER_PATH=/app/images
      - IMAGE_PUBLIC_URL=https://zycroft.duckdns.org/GameGen-images
      # API keys can be set here or loaded from config-api.json
      # - OPENAI_API_KEY=
      # - CLAUDE_API_KEY=
      # - GEMINI_API_KEY=
      # - GROK_API_KEY=
    volumes:
      # Mount config files
      - ../config.json:/app/config.json:ro
      - ../config-api.json:/app/config-api.json:ro
      # Mount NGINX images directory for direct writes
      - /var/www/GameGen-images/html:/app/images
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
